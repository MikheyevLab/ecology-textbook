# Publish the book to GitHub Pages (gh-pages branch) on every push to main.
# R code is NOT run in CI: computations are frozen locally (book/_freeze/,
# committed to the repo). After changing R code in a chapter, run
# `quarto render book` locally and commit the updated _freeze/ directory.
name: Publish book

on:
  push:
    branches: main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
      - uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          path: book
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
